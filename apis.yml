aid: wallex
name: Wallex
description: >-
  Wallex is a Singapore-headquartered cross-border payments and business banking
  platform for businesses across Southeast Asia and Greater China. Its Partner
  API is a JSON REST API that lets platforms embed multi-currency wallets, issue
  virtual collection accounts, run FX conversions, send cross-border payments to
  beneficiaries, and onboard and KYC their own members. The API is organised
  around a hierarchical account model (Standard and Partner accounts, Individual
  and Company entities, Regular and Lite KYC) and covers authentication,
  balances, beneficiaries, collections, collection requests, conversions,
  currencies, deductions, funding, internal transfers, payments, users, and
  webhooks. Wallex is a portfolio company of 500 Global.
