      - {type: has_many, target: Balance, via: balances}
      - {type: has_many, target: Account, via: members, note: partner accounts onboard member accounts}
  - name: User
    attributes: [status (pending_approval|approved|document_needs_resubmission|withdrawn|terminated|closed)]
    relationships:
      - {type: belongs_to, target: Account}
      - {type: has_one, target: Company, via: userId}
      - {type: has_one, target: CustomerDueDiligence, via: userId}
      - {type: has_many, target: Document, via: userId}
  - name: Company
    relationships:
      - {type: belongs_to, target: User, via: userId}
  - name: CustomerDueDiligence
    relationships:
      - {type: belongs_to, target: User, via: userId}
  - name: Document
    relationships:
      - {type: belongs_to, target: User, via: userId}
  - name: Beneficiary
    relationships:
      - {type: belongs_to, target: Account}
  - name: Balance
    attributes: [currency]
    relationships:
      - {type: belongs_to, target: Account}
