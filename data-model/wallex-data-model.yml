notes: >-
  Entity graph derived from the Concept page and the object descriptions in the
  operation reference. The Wallex account model is hierarchical: an Account has
  Users; a Partner account onboards member Accounts; transactions execute under
  an approved User via onBehalfOfAccount/onBehalfOfUser.
entities:
